<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rockview Partners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f1417;
      --charcoal: #12191d;
      --graphite: #1b2328;
      --linen: #f4efe6;
      --sand: #e4dac9;
      --brass: #b08a43;
      --line: rgba(15, 20, 23, 0.2);
      --bg-gradient:
        radial-gradient(1100px 800px at 10% -20%, rgba(176, 138, 67, 0.16), transparent 60%),
        radial-gradient(900px 700px at 90% 10%, rgba(21, 30, 34, 0.25), transparent 55%),
        linear-gradient(180deg, #f8f3ea 0%, #eee5d7 100%);
      --frame-bg: rgba(247, 242, 234, 0.75);
      --frame-border: rgba(15, 20, 23, 0.12);
      --icon-bg: rgba(18, 25, 29, 0.92);
      --icon-color: #f5efe4;
      --contact: var(--charcoal);
      --glow: radial-gradient(circle, rgba(176, 138, 67, 0.14), transparent 60%);
      --shadow: 0 30px 80px rgba(10, 12, 14, 0.2);
    }

    :root[data-theme="dark"] {
      --ink: #e9ecef;
      --charcoal: #dfe4e8;
      --graphite: #20272c;
      --linen: #0f1417;
      --sand: #1a2126;
      --brass: #c9a55c;
      --line: rgba(233, 236, 239, 0.2);
      --bg-gradient:
        radial-gradient(1200px 900px at 20% -30%, rgba(201, 165, 92, 0.18), transparent 60%),
        radial-gradient(900px 700px at 80% 10%, rgba(12, 16, 18, 0.6), transparent 55%),
        linear-gradient(180deg, #0d1114 0%, #12181d 100%);
      --frame-bg: rgba(18, 22, 26, 0.82);
      --frame-border: rgba(233, 236, 239, 0.12);
      --icon-bg: rgba(232, 236, 239, 0.08);
      --icon-color: #f7f1e6;
      --contact: #dfe4e8;
      --glow: radial-gradient(circle, rgba(201, 165, 92, 0.2), transparent 60%);
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--ink);
      font-family: "Manrope", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 40px 24px;
    }

    .frame {
      width: min(980px, 100%);
      min-height: 70vh;
      border-radius: 36px;
      background: var(--frame-bg);
      border: 1px solid var(--frame-border);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: 1fr auto;
      position: relative;
      overflow: hidden;
    }

    .logo-wrap {
      display: grid;
      place-items: center;
      padding: 48px 24px 16px;
    }

    .logo {
      width: clamp(160px, 22vw, 240px);
      height: auto;
      filter: drop-shadow(0 16px 30px rgba(10, 12, 14, 0.2));
    }

    .icons {
      display: flex;
      justify-content: center;
      gap: clamp(24px, 6vw, 64px);
      padding: 8px 24px 48px;
    }

    .icon-pill {
      width: clamp(72px, 12vw, 110px);
      aspect-ratio: 1;
      border-radius: 999px;
      background: var(--icon-bg);
      border: 1px solid rgba(176, 138, 67, 0.3);
      display: grid;
      place-items: center;
      position: relative;
      box-shadow: 0 18px 40px rgba(15, 20, 23, 0.24);
    }

    .material-symbols-outlined {
      font-size: clamp(30px, 5vw, 44px);
      color: var(--icon-color);
      font-variation-settings: "wght" 300, "FILL" 0, "GRAD" 0, "opsz" 24;
    }

    .heart-icon {
      font-variation-settings: "wght" 300, "FILL" 1, "GRAD" 0, "opsz" 24;
      background: linear-gradient(135deg, #f7f2e6 0%, var(--brass) 70%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    .pulse {
      animation: pulse 4s ease-in-out infinite;
    }

    .screen::before,
    .screen::after {
      content: "";
      position: absolute;
      width: 64%;
      height: 64%;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(176, 138, 67, 0.7), rgba(244, 239, 230, 0.1));
      opacity: 0.7;
      animation: screenShift 6s ease-in-out infinite;
    }

    .screen::after {
      width: 54%;
      height: 54%;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(245, 239, 228, 0.9), rgba(176, 138, 67, 0.2));
      animation-delay: 3s;
      opacity: 0.55;
    }

    .ai {
      animation: orbit 7s ease-in-out infinite;
    }

    .ai::before {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brass);
      top: 12px;
      left: 16px;
      box-shadow: 0 0 12px rgba(176, 138, 67, 0.8);
      animation: drift 5s ease-in-out infinite;
    }

    .contact {
      justify-self: end;
      align-self: end;
      margin: 0 32px 28px 0;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      font-size: 0.7rem;
      color: var(--contact);
      border-bottom: 1px solid transparent;
      transition: border-color 0.4s ease, color 0.4s ease;
      text-decoration: none;
    }

    .contact:hover {
      color: var(--brass);
      border-color: var(--brass);
    }

    .theme-toggle {
      position: absolute;
      top: 22px;
      right: 22px;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      display: grid;
      place-items: center;
      color: var(--contact);
      cursor: pointer;
      box-shadow: none;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
      color: var(--brass);
    }

    .theme-toggle .material-symbols-outlined {
      font-variation-settings: "wght" 400, "FILL" 0, "GRAD" 0, "opsz" 24;
    }

    :root:not([data-theme="dark"]) .theme-toggle .material-symbols-outlined {
      color: #0c1114;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes screenShift {
      0%, 100% { transform: translate(0, 0); opacity: 0.6; }
      50% { transform: translate(6px, -4px); opacity: 0.9; }
    }

    @keyframes orbit {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(6px, -10px); }
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); opacity: 0.6; }
      50% { transform: translate(18px, 10px); opacity: 1; }
    }

    @media (max-width: 720px) {
      .frame {
        min-height: 65vh;
      }

      .contact {
        justify-self: center;
        margin: 16px 0 28px;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <button class="theme-toggle" type="button" aria-label="Toggle theme">
      <span class="material-symbols-outlined" data-theme-icon>dark_mode</span>
    </button>
    <div class="logo-wrap">
      <img class="logo" src="logo.png" alt="Rockview Partners" />
    </div>
    <div class="icons">
      <div class="icon-pill pulse" aria-hidden="true">
        <span class="material-symbols-outlined heart-icon">favorite</span>
      </div>
      <div class="icon-pill ai" aria-hidden="true">
        <span class="material-symbols-outlined">hub</span>
      </div>
      <div class="icon-pill screen" aria-hidden="true">
        <span class="material-symbols-outlined">laptop_mac</span>
      </div>
    </div>
    <a class="contact" href="mailto:bajet@rockview.partners" aria-label="Contact Rockview Partners">contact</a>
  </div>

  <script>
    const root = document.documentElement;
    const toggle = document.querySelector(".theme-toggle");
    const icon = document.querySelector("[data-theme-icon]");
    const stored = localStorage.getItem("theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

    if (stored) {
      root.setAttribute("data-theme", stored);
    } else if (prefersDark) {
      root.setAttribute("data-theme", "dark");
    }

    const syncIcon = () => {
      const isDark = root.getAttribute("data-theme") === "dark";
      icon.textContent = isDark ? "light_mode" : "dark_mode";
    };

    syncIcon();

    toggle.addEventListener("click", () => {
      const isDark = root.getAttribute("data-theme") === "dark";
      const next = isDark ? "light" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      syncIcon();
    });
  </script>
</body>
</html>
